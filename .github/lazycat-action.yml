version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/frames.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: frames
    bump: patch

build:
  run_buildscript: false

images:
  # 主应用：上游 elevenam/frames 无 semver/sha 家族，仅有日期戳 immutable 家族 + latest/dev → 用日期家族 + bump: patch
  - id: frames
    target: service
    service: frames
    source: elevenam/frames
    channel: custom
    sort: created
    tag_regex: '^\d{4}-\d{2}-\d{2}-\d{2}-\d{2}$'
    delivery:
      mode: lazycat
  # 辅助 postgres：pgvector/pgvector pg14 家族（X.Y.Z-pg14），tag 带后缀 → custom + 版本映射
  - id: postgres
    target: service
    service: postgres
    source: pgvector/pgvector
    channel: custom
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+-pg14$'
    version_regex: '^(?P<version>\d+\.\d+\.\d+)-pg14$'
    version_template: '{version}'
    delivery:
      mode: lazycat
  # 辅助 redis：7-alpine 家族，tag 带后缀 → custom + 版本映射
  - id: redis
    target: service
    service: redis
    source: library/redis
    channel: custom
    sort: semver
    tag_regex: '^7\.\d+-alpine$'
    version_regex: '^(?P<version>7\.\d+)-alpine$'
    version_template: '{version}.0'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: Frames
    summary: "您的现代流媒体服务平台"
